services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tfg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tfg_password}
      POSTGRES_DB: ${POSTGRES_DB:-tfg_validator}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tfg} -d ${POSTGRES_DB:-tfg_validator}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    networks:
      - app-network

  backend:
    build: ./backend
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      chromadb:
        condition: service_started
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - CHROMA_HOST=chromadb
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  chroma_data:
